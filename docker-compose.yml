services:
  attendance_pratham:
    build: .
    container_name: attendance_pratham
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
    env_file:
      - .env
    volumes:
      # Persist auth data and config so it survives restarts
      - ./data:/app/data
    command: node index.js

  webui_pratham:
    build: .
    container_name: attendance-webui-pratham
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
      - WEB_PORT=${WEB_PORT:-3000}
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    volumes:
      # Share data directory with attendance service
      - ./data:/app/data
    command: node server.js
    depends_on:
      - attendance_pratham
