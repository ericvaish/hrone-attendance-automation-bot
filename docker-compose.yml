services:
  attendance:
    build: .
    container_name: attendance
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      # Persist auth data and config so it survives restarts
      - ./data:/app/data
